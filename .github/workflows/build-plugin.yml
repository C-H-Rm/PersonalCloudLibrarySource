name: Build Playnite plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - PersonalCloudLibrarySource/**
      - tests/CacheControllers.Tests/**
      - tests/CacheSafety.Tests/**
      - tests/RcloneTransfers.Tests/**
      - tests/ModSync.Tests/**
      - tests/ModSyncUx.Tests/**
      - tests/InstallProgress.Tests/**
      - tools/add-install-progress-to-theme.ps1
      - tools/test-install-progress-theme.py
      - tools/package-extension.ps1
      - tools/verify-package.ps1
      - tools/test-package-extension.ps1
      - tools/test-build-pipeline.py
      - tools/publish-nightly.py
      - tools/test-nightly-release.py
      - global.json
      - .github/workflows/build-plugin.yml
  pull_request:
    branches: [main]
    paths:
      - PersonalCloudLibrarySource/**
      - tests/CacheControllers.Tests/**
      - tests/CacheSafety.Tests/**
      - tests/RcloneTransfers.Tests/**
      - tests/ModSync.Tests/**
      - tests/ModSyncUx.Tests/**
      - tests/InstallProgress.Tests/**
      - tools/add-install-progress-to-theme.ps1
      - tools/test-install-progress-theme.py
      - tools/package-extension.ps1
      - tools/verify-package.ps1
      - tools/test-package-extension.ps1
      - tools/test-build-pipeline.py
      - tools/publish-nightly.py
      - tools/test-nightly-release.py
      - global.json
      - .github/workflows/build-plugin.yml

permissions:
  contents: read

concurrency:
  group: build-plugin-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a main build while it is updating release assets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify .pext
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      package_artifact_id: ${{ steps.upload_package.outputs.artifact-id }}
      info_artifact_id: ${{ steps.upload_info.outputs.artifact-id }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Test async cache controllers
        run: dotnet run --project tests/CacheControllers.Tests/CacheControllers.Tests.csproj --configuration Release

      - name: Test nightly publication guards without network access
        run: python -B tools/test-nightly-release.py

      - name: Test inline installation state and safe theme integration
        run: |
          dotnet run --project tests/InstallProgress.Tests/InstallProgress.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Inline progress state tests failed.' }
          python -B tools/test-install-progress-theme.py --pwsh (Get-Command pwsh).Source
          if ($LASTEXITCODE -ne 0) { throw 'Theme integration tests failed.' }

      - name: Test cache deletion safety
        run: dotnet run --project tests/CacheSafety.Tests/CacheSafety.Tests.csproj --configuration Release

      - name: Set up verified rclone for transfer tests
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'rclone-v1.75.2-windows-amd64.zip'
          Invoke-WebRequest 'https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-windows-amd64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '8a9db2bad1dc79a65b3348fd857069598e2aab7cf4d118b77b1df23055aff818') {
            throw 'rclone archive checksum mismatch.'
          }
          $root = Join-Path $env:RUNNER_TEMP 'pcls-rclone'
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          "PCLS_RCLONE=$root/rclone-v1.75.2-windows-amd64/rclone.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PCLS_DOTNET=$((Get-Command dotnet).Source)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test rclone transfer timeouts and local copies
        run: dotnet run --project tests/RcloneTransfers.Tests/RcloneTransfers.Tests.csproj --configuration Release

      - name: Test mod sync safety, cancellation and recovery
        run: dotnet run --project tests/ModSync.Tests/ModSync.Tests.csproj --configuration Release

      - name: Test mod sync interaction and progress presentation
        run: dotnet run --project tests/ModSyncUx.Tests/ModSyncUx.Tests.csproj --configuration Release

      - name: Build, package and inspect Playnite plugin
        id: package
        run: ./tools/package-extension.ps1 -MSBuildPath (Get-Command dotnet).Source

      - name: Test package validation guards
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: ./tools/test-package-extension.ps1 -PackagePath $env:PACKAGE_PATH

      # upload-artifact v7 can expose a single .pext directly, without an outer ZIP.
      - name: Upload installable Playnite file
        id: upload_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.package_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum and build receipt
        id: upload_info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PersonalCloudLibrarySource-build-info
          path: |
            ${{ steps.package.outputs.receipt_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

  nightly:
    name: Publish nightly prerelease
    needs: build
    if: >-
      github.repository == 'C-H-Rm/PersonalCloudLibrarySource' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact installable file from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.package_artifact_id }}
          path: dist
          # A .pext is itself a ZIP: keep it intact for installation.
          skip-decompress: true

      - name: Download this build's checksum and source receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.info_artifact_id }}
          path: dist

      - name: Publish and verify the managed nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/publish-nightly.py --artifacts dist
